<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HEIC to JPG/JPEG Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <span class="navbar-brand fw-semibold">
      HEIC<span class="text-primary">2JPG</span>
    </span>
    <span class="badge bg-light text-dark">Local & Secure</span>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card glass-card p-4 p-md-5">

        <h1 class="fw-semibold mb-2">
          Convert Images to <span class="text-gradient">JPG/JPEG</span>
        </h1>
        <p class="text-muted mb-4">
          Upload images or folders. Convert individually or in bulk.
        </p>

        <!-- Upload -->
        <input type="file" id="fileInput" multiple hidden accept="image/*,.heic,.heif">
        <input type="file" id="folderInput" multiple webkitdirectory hidden accept="image/*,.heic,.heif">

        <div class="d-flex flex-wrap gap-2 mb-3">
          <button id="btnUpload" class="btn btn-primary btn-lg">
            <i class="bi bi-image me-2"></i>Select Images
          </button>
          <button id="btnUploadFolder" class="btn btn-outline-primary btn-lg">
            <i class="bi bi-folder2-open me-2"></i>Select Folder
          </button>
        </div>

        <!-- Drag & Drop -->
        <div id="dropZone" class="drop-zone mb-3" role="button" tabindex="0" aria-label="Drop images or folders here">
          <div class="drop-zone-inner">
            <i class="bi bi-cloud-arrow-up fs-3"></i>
            <div class="mt-2 fw-semibold">Drag & drop images or a folder here</div>
            <div class="text-muted small">or click to browse</div>
          </div>
        </div>

        <!-- Folder Info -->
        <div id="folderInfo" class="alert alert-light d-none"></div>

        <!-- Settings -->
        <div class="row g-3 mt-3">
          <div class="col-md-5">
            <label class="form-label">Output Folder Name</label>
            <input type="text" id="outputName" class="form-control" placeholder="Converted_JPGs">
          </div>
          <div class="col-md-3">
            <label class="form-label">Extension</label>
            <select id="outputExt" class="form-select">
              <option value="jpg" selected>.jpg</option>
              <option value="jpeg">.jpeg</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">JPEG Quality</label>
            <input type="range" id="quality" min="60" max="100" value="90" class="form-range">
            <small class="text-muted">Quality: <span id="qLabel">90</span>%</small>
          </div>
        </div>

        <!-- Image List -->
        <div id="imageList" class="mt-4 d-none">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <strong>Images</strong>
            <div>
              <button id="selectAll" class="btn btn-sm btn-outline-secondary">Select All</button>
              <button id="clearAll" class="btn btn-sm btn-outline-secondary">Clear</button>
            </div>
          </div>
          <div class="list-group" id="imageItems"></div>
        </div>

        <!-- Convert -->
        <div class="d-grid mt-4">
          <button id="btnConvert" class="btn btn-success btn-lg" disabled>
            Convert Selected
          </button>
        </div>

        <!-- Progress -->
        <div id="progressWrap" class="mt-4 d-none">
          <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <small class="text-muted mt-2 d-block" id="progressText"></small>
        </div>

      </div>

    </div>
  </div>
</main>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<script src="app.js"></script>
</body>
</html>
